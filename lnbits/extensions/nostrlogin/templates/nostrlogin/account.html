{% extends "base.html" %}
{% block scripts %}
<script src="{{ static_url_for('nostrlogin/static', path='js/account.js') }}"></script>
{% endblock %}
{% block page %}
<div class="row q-col-gutter-md justify-center">
  <div class="col-12 col-md-8 col-lg-6">
    <q-card>
      <q-card-section class="text-center">
        <div class="text-h5">Nostr Keys</div>
        <small>
          Link your Nostr key (npub) to this account so you can sign in with a
          remote signer.
        </small>
      </q-card-section>

      <q-card-section>
        <q-input
          readonly
          filled
          dense
          :model-value="linkedNpub || 'no nostr key linked'"
          label="Linked public key"
        ></q-input>
        <div class="row q-mt-md q-gutter-sm">
          <q-btn
            unelevated
            color="primary"
            icon="link"
            label="Link new key"
            @click="startLinkSession"
          ></q-btn>
          <q-btn
            v-if="g.user.pubkey"
            flat
            color="negative"
            icon="unlink"
            label="Unlink"
            @click="unlinkKey"
          ></q-btn>
          <lnbits-extension-settings-btn-dialog
            v-if="g.user.super_user"
            :options="settingsOptions"
            :adminkey="adminKey"
            endpoint="/nostrlogin/api/v1/admin/settings"
          ></lnbits-extension-settings-btn-dialog>
        </div>
      </q-card-section>

      <q-card-section v-if="linkUri" class="text-center">
        <q-separator class="q-mb-md"></q-separator>
        <div class="text-h6">Scan with your signer</div>
        <lnbits-qrcode :value="linkUri" :max-width="300"></lnbits-qrcode>
        <q-spinner-dots v-if="linkStatus === 'pending'" size="2rem"></q-spinner-dots>
        <div v-if="linkStatus === 'failed'" class="text-negative">
          Linking failed.
        </div>
      </q-card-section>

      <q-banner v-if="authUrl" class="bg-warning text-black q-ma-md">
        Your signer requires additional authentication.
        <a :href="authUrl" target="_blank" rel="noopener">Continue here</a>.
      </q-banner>
    </q-card>
  </div>
</div>
{% endblock %}
