{% extends "base.html" %}
{% block scripts %}
<script src="{{ static_url_for('nostrlogin/static', path='js/index.js') }}"></script>
{% endblock %}
{% block page %}
<div class="row q-col-gutter-md justify-center">
  <div class="col-12 col-md-8 col-lg-6">
    <q-card>
      <q-card-section class="text-center">
        <div class="text-h5">Sign in with Nostr</div>
        <small>
          Scan the QR code with your NIP-46 remote signer
          (e.g. Amber, nsecBunker) to sign in.
        </small>
      </q-card-section>

      <q-card-section v-if="connectUri" class="text-center">
        <lnbits-qrcode :value="connectUri" :max-width="300"></lnbits-qrcode>
        <q-input
          readonly
          filled
          dense
          type="textarea"
          rows="3"
          :model-value="connectUri"
          label="NostrConnect URI"
          class="q-mt-md"
        >
          <template v-slot:after>
            <q-btn flat dense icon="content_copy" @click="copyUri"></q-btn>
          </template>
        </q-input>
        <q-btn
          unelevated
          color="primary"
          icon="open_in_new"
          label="Open signer app"
          class="q-mt-md full-width"
          :href="'nostrconnect://' + connectUri.split('nostrconnect://')[1] || connectUri"
          type="a"
        ></q-btn>
      </q-card-section>

      <q-banner v-if="authUrl" class="bg-warning text-black q-ma-md">
        Your signer requires additional authentication.
        <a :href="authUrl" target="_blank" rel="noopener">Continue here</a>.
      </q-banner>

      <q-card-section class="text-center">
        <q-spinner-dots v-if="status === 'pending'" size="2rem"></q-spinner-dots>
        <div v-if="statusText" v-text="statusText" class="q-mt-sm"></div>
      </q-card-section>

      <q-card-actions align="center">
        <q-btn flat color="grey" label="Back" href="/"></q-btn>
      </q-card-actions>
    </q-card>
  </div>
</div>
{% endblock %}
